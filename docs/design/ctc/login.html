<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team KMS ｜ 系統登入</title>
  <style>
    :root {
      --bg: #080b10;
      --panel: #111722;
      --panel-2: #151e2b;
      --ink: #edf4ff;
      --muted: #8fa1b6;
      --line: #2a3a4d;
      --green: #28d17c;
      --amber: #ffbf3d;
      --red: #ff4d5e;
      --blue: #58a6ff;
      --orange: #ff7a1a;
      --shadow: 0 20px 50px rgba(0,0,0,.5);
      --radius: 20px;
      --radius-sm: 10px;
      --stroke: 1px solid rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(88,166,255,.12), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(255,122,26,.08), transparent 35%),
        linear-gradient(180deg,#070a0f 0%,#0b1018 45%,#06080c 100%);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Centered Login Card */
    .login-container {
      width: 100%;
      max-width: 420px;
      border: var(--stroke);
      background: linear-gradient(180deg, rgba(21,30,43,.98), rgba(15,22,33,.98));
      border-radius: var(--radius);
      box-shadow: var(--shadow), 0 0 0 1px rgba(88,166,255,.05) inset;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    
    /* Top neon indicator strip */
    .login-container:before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--amber));
      box-shadow: 0 2px 10px rgba(88,166,255,.45);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      margin: 0 0 6px;
      letter-spacing: -.02em;
    }
    .brand-eyebrow {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 24px;
      position: relative;
    }
    .form-label {
      display: block;
      font-size: 10px;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-prompt {
      position: absolute;
      left: 12px;
      color: var(--blue);
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, .25);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--ink);
      padding: 12px 12px 12px 28px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .form-input:focus {
      border-color: var(--blue);
      background: rgba(0, 0, 0, .4);
      box-shadow: 0 0 12px rgba(88,166,255,.2);
    }

    /* Action button */
    .btn-login {
      width: 100%;
      background: #edf4ff;
      color: #07101b;
      font-weight: 900;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 rgba(88,166,255,.75);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover {
      transform: translate(-1px, -1px);
      box-shadow: 6px 6px 0 rgba(255,191,61,.8);
    }
    .btn-login:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 transparent;
    }

    /* Footer Metadata details */
    .system-status {
      margin-top: 32px;
      border-top: 1px solid rgba(255,255,255,.05);
      padding-top: 16px;
      font-size: 9px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      box-shadow: 0 0 6px var(--green);
    }

    /* Glitch screen overlay */
    #fx-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #030508;
      z-index: 10000;
      display: none;
      overflow: hidden;
      transform-origin: center;
    }
    .scanline {
      width: 100%;
      height: 100%;
      background:
        linear-gradient(to bottom,rgba(255,255,255,0) 50%,rgba(255,255,255,.045) 50%),
        linear-gradient(90deg,rgba(88,166,255,.12),rgba(255,191,61,.035),rgba(255,122,26,.10));
      background-size: 100% 4px, 4px 100%;
      pointer-events: none;
    }
    .glitch-line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: #edf4ff;
      box-shadow: 0 0 24px rgba(88,166,255,.88), 0 0 42px rgba(255,191,61,.42);
      transform: translateY(-50%) scaleY(0);
    }
    .reboot-anim {
      display: block !important;
      animation: screen-burn .5s ease-in forwards;
    }
    .reboot-anim .glitch-line { animation: glitch-flash .5s ease-in forwards }
    @keyframes screen-burn {
      0% { opacity: 0; }
      10% { opacity: 1; }
      80% { transform: scaleY(1); }
      100% { transform: scaleY(.006) scaleX(1.4); opacity: 1; }
    }
    @keyframes glitch-flash {
      0% { transform: translateY(-50%) scaleY(0); }
      28% { transform: translateY(-50%) scaleY(1); }
      100% { transform: translateY(-50%) scaleY(.2); }
    }
  </style>
</head>
<body>
  <div id="fx-overlay" aria-hidden="true"><div class="scanline"></div><div class="glitch-line"></div></div>

  <div class="login-container">
    <div class="brand">
      <div class="brand-eyebrow">Secure Terminal Access</div>
      <h2 class="brand-title">KMS CONTROL CENTER</h2>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">User Identity</label>
        <div class="input-wrapper">
          <span class="input-prompt">&gt;</span>
          <input type="email" id="email" class="form-input" placeholder="email@address" required value="dev@teamkms.dev" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Security Cipher</label>
        <div class="input-wrapper">
          <span class="input-prompt">&gt;</span>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required value="TeamKMS-dev-2026" />
        </div>
      </div>

      <button type="submit" class="btn-login">
        <span>Connect Session</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
      </button>
    </form>

    <div class="system-status">
      <div>SYS: OPERATIONAL</div>
      <div><span class="status-dot"></span> LINK ACTIVE</div>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      
      const overlay = document.getElementById('fx-overlay');
      overlay.classList.add('reboot-anim');
      
      setTimeout(() => {
        window.location.href = 'wikis.html';
      }, 500);
    }
  </script>
</body>
</html>
