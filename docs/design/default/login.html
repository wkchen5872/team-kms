<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team KMS ｜ 系統登入</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
      --blue-hover: #2563eb;
      --shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.02);
      --radius: 12px;
      --radius-sm: 8px;
      --stroke: 1px solid var(--line);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(59,130,246,.05), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(59,130,246,.03), transparent 40%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Centered Login Card */
    .login-container {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      position: relative;
    }
    
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .brand-subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: #ffffff;
      border: var(--stroke);
      border-radius: var(--radius-sm);
      color: var(--ink);
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .form-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(59,130,246,.15);
    }

    /* Action button */
    .btn-login {
      width: 100%;
      background: var(--ink);
      color: #ffffff;
      font-weight: 600;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 13.5px;
      transition: opacity 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-login:hover {
      opacity: 0.9;
    }

    /* System Status Details */
    .system-status {
      margin-top: 28px;
      border-top: var(--stroke);
      padding-top: 16px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--green);
      font-weight: 600;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
    }

    /* Screen Transition overlay */
    #fx-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      z-index: 10000;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .fade-out-anim {
      display: block !important;
      animation: fade-out 0.3s ease forwards;
    }
    @keyframes fade-out {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="fx-overlay" aria-hidden="true"></div>

  <div class="login-container">
    <div class="brand">
      <h2 class="brand-title">登入系統</h2>
      <div class="brand-subtitle">Team KMS 知識管理系統</div>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">電子郵件 Email</label>
        <input type="email" id="email" class="form-input" placeholder="name@example.com" required value="dev@teamkms.dev" />
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="password">安全密碼 Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required value="TeamKMS-dev-2026" />
      </div>

      <button type="submit" class="btn-login">
        <span>登入 Sign In</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" x2="19" y1="12" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>

    <div class="system-status">
      <div>系統狀態: 正常運作</div>
      <div class="status-badge">
        <span class="status-dot"></span> 連線正常
      </div>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      
      const overlay = document.getElementById('fx-overlay');
      overlay.classList.add('fade-out-anim');
      
      setTimeout(() => {
        window.location.href = 'wikis.html';
      }, 300);
    }
  </script>
</body>
</html>
